# Projet Xcode généré par XcodeGen (brew install xcodegen ; xcodegen generate)
name: LumioSwift
options:
  bundleIdPrefix: lol.wawanono
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
targets:
  LumioSwift:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Lumio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.wawanono.lumio.swift
        PRODUCT_NAME: "Lumio Swift"
        INFOPLIST_FILE: Lumio/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: NO
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
schemes:
  LumioSwift:
    build:
      targets:
        LumioSwift: all
    run:
      config: Debug
    archive:
      config: Release
