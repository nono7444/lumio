name: Build Lumio

# Lance le build à chaque push sur main, à chaque tag v*, ou à la main depuis l'onglet Actions.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Génère le projet Android
        run: npx expo prebuild --platform android --no-install --clean
      - name: Compile l'APK (release, signé avec la clé de debug)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Renomme l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk lumio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lumio-android
          path: lumio.apk

  ios:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Génère le projet iOS
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Installe les pods
        working-directory: ios
        run: pod install
      - name: Compile l'app (non signée)
        run: |
          xcodebuild \
            -workspace ios/Lumio.xcworkspace \
            -scheme Lumio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 50
          test -d build/Build/Products/Release-iphoneos/Lumio.app
      - name: Emballe l'IPA (à resigner avec SideStore / AltStore / Sideloadly)
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Lumio.app Payload/
          zip -qry lumio-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: lumio-ios
          path: lumio-unsigned.ipa

  # Publie une Release à chaque build de main : liens de téléchargement directs, sans connexion
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Lumio build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            iPhone : télécharge lumio-unsigned.ipa puis installe-le avec Sideloadly ou SideStore.
            Android : télécharge lumio.apk et ouvre-le.
          files: |
            lumio.apk
            lumio-unsigned.ipa
