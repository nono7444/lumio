name: Build Lumio (iOS)

# Lance le build à chaque push sur main, à chaque tag v*, ou à la main depuis l'onglet Actions.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  ios:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Numéro de version (1.0.<n° de build>) pour la détection des mises à jour
        run: |
          node -e "const f='app.json';const a=require('./'+f);a.expo.version='1.0.${{ github.run_number }}';a.expo.ios=a.expo.ios||{};a.expo.ios.buildNumber='${{ github.run_number }}';require('fs').writeFileSync(f,JSON.stringify(a,null,2))"
          grep -n '"version"\|buildNumber' app.json
      - name: Génère le projet iOS
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Installe les pods
        working-directory: ios
        run: pod install
      - name: Compile l'app (non signée)
        run: |
          xcodebuild \
            -workspace ios/Lumio.xcworkspace \
            -scheme Lumio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 50
          test -d build/Build/Products/Release-iphoneos/Lumio.app
      - name: Emballe l'IPA (à resigner avec SideStore / AltStore / Sideloadly)
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Lumio.app Payload/
          zip -qry lumio-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: lumio-ios
          path: lumio-unsigned.ipa

  # Publie une Release à chaque build de main : liens de téléchargement directs, sans connexion
  release:
    # Publie dès que l'iPhone est prêt, même si l'APK TV a échoué
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Source AltStore / FlareStore (mises à jour automatiques)
        env:
          # Notes de version affichées dans l'appli : le message du commit (ou de la fusion)
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: node scripts/make-source.mjs "1.0.${{ github.run_number }}" "build-${{ github.run_number }}" lumio-unsigned.ipa
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Lumio build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Lumio 1.0.${{ github.run_number }}
            iPhone : télécharge lumio-unsigned.ipa puis installe-le avec Sideloadly, SideStore ou FlareStore.
            Source pour mises à jour automatiques : https://github.com/${{ github.repository }}/releases/latest/download/altstore.json
            Android TV : voir https://github.com/nono7444/lumio-tv
          fail_on_unmatched_files: false
          files: |
            lumio-unsigned.ipa
            altstore.json
