name: Build Lumio (iOS, Android, Android TV, Mac)

# Lance le build à chaque push sur main, à chaque tag v*, ou à la main depuis l'onglet Actions.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  ios:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Numéro de version (1.0.<n° de build>) pour la détection des mises à jour
        run: |
          node -e "const f='app.json';const a=require('./'+f);a.expo.version='1.0.${{ github.run_number }}';a.expo.ios=a.expo.ios||{};a.expo.ios.buildNumber='${{ github.run_number }}';require('fs').writeFileSync(f,JSON.stringify(a,null,2))"
          grep -n '"version"\|buildNumber' app.json
      - name: Génère le projet iOS
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Installe les pods
        working-directory: ios
        run: pod install
      - name: Compile l'app (non signée)
        run: |
          xcodebuild \
            -workspace ios/Lumio.xcworkspace \
            -scheme Lumio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > xcodebuild.log 2>&1 || {
              # Échec : les erreurs de compilation remontent en annotations (journaux GitHub parfois illisibles)
              grep -E "error:|\*\* BUILD FAILED" xcodebuild.log | sort -u | head -30 | while IFS= read -r l; do echo "::error::$l"; done
              tail -n 80 xcodebuild.log
              exit 1
            }
          tail -n 20 xcodebuild.log
          test -f build/Build/Products/Release-iphoneos/Lumio.app/Info.plist
      - name: Emballe l'IPA (à resigner avec SideStore / AltStore / Sideloadly)
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Lumio.app Payload/
          zip -qry lumio-unsigned.ipa Payload
          # Garde-fou : une IPA de quelques octets ne doit jamais être publiée
          size=$(stat -c %s lumio-unsigned.ipa 2>/dev/null || stat -f %z lumio-unsigned.ipa)
          echo "IPA : $size octets"
          if [ "$size" -lt 5000000 ]; then echo "::error::IPA anormalement petite ($size octets)"; ls -la Payload/Lumio.app | head -30; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: lumio-ios
          path: lumio-unsigned.ipa

  # Appli Android (téléphones) : APK signé avec une clé fixe, pour pouvoir mettre à jour par-dessus
  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Numéro de version (1.0.<n° de build>)
        run: node -e "const f='app.json';const a=require('./'+f);a.expo.version='1.0.${{ github.run_number }}';a.expo.android.versionCode=${{ github.run_number }};require('fs').writeFileSync(f,JSON.stringify(a,null,2))"
      - name: Génère le projet Android
        run: npx expo prebuild --platform android --no-install --clean
      - name: Clé de signature fixe (même signature à chaque version)
        run: cp keystore/lumio-android.keystore android/app/debug.keystore
      - name: Compile l'APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a > gradle.log 2>&1 || {
            # Échec : les erreurs remontent en annotations (journaux GitHub parfois illisibles)
            # GitHub ne garde que 10 annotations par étape : tout est réuni en une seule
            msg=$( { grep -A14 "issues were found when checking AAR metadata" gradle.log; grep -E "^e: |error:|What went wrong|Execution failed" -A2 gradle.log; } | grep -v "^--$" | awk '!seen[$0]++' | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error::$msg"
            tail -n 60 gradle.log
            exit 1
          }
          tail -n 15 gradle.log
      - name: Renomme l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk lumio-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lumio-android
          path: lumio-android.apk

  # Appli Mac (Intel + Apple Silicon) : la version web de Lumio dans une fenêtre Electron, en .dmg
  mac:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Numéro de version (1.0.<n° de build>)
        run: |
          node -e "const f='app.json';const a=require('./'+f);a.expo.version='1.0.${{ github.run_number }}';require('fs').writeFileSync(f,JSON.stringify(a,null,2))"
          node -e "const f='desktop/package.json';const a=require('./'+f);a.version='1.0.${{ github.run_number }}';require('fs').writeFileSync(f,JSON.stringify(a,null,2))"
      - name: Exporte l'appli web
        run: npx expo export -p web --output-dir desktop/web
      - name: Construit le .dmg (non signé)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npm run dist
          ls -la dist
          cp dist/lumio-mac.dmg ../lumio-mac.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: lumio-mac
          path: lumio-mac.dmg

  # Publie une Release à chaque build de main : liens de téléchargement directs, sans connexion
  # Test de démarrage de l'APK sur un téléphone virtuel : une version qui plante à l'ouverture n'est pas publiée
  android-smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Accélération matérielle de l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: lumio-android
      - name: Ouvre l'appli 40 s sur un téléphone virtuel (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r lumio-android.apk
            adb logcat -c
            adb shell monkey -p lol.wawanono.lumio -c android.intent.category.LAUNCHER 1
            sleep 40
            adb logcat -d > logcat.txt || true
            if adb shell pidof lol.wawanono.lumio > /dev/null; then echo "::notice::L'appli tourne toujours après 40 s"; else msg=$(grep -A30 "FATAL EXCEPTION" logcat.txt | head -32 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); echo "::error::Plantage au démarrage%0A$msg"; exit 1; fi

  release:
    needs: [ios, android, android-smoke, mac]
    # Publie dès que l'iPhone est prêt, même si l'APK Android a échoué
    if: ${{ always() && needs.ios.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: APK Android non publié s'il plante au démarrage
        if: ${{ needs.android-smoke.result != 'success' }}
        run: rm -f lumio-android.apk
      - name: Notes de version (section « À venir » du CHANGELOG, sinon message du commit)
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          node scripts/changelog.mjs notes > notes.md
          if [ ! -s notes.md ]; then printf '%s\n' "$COMMIT_MSG" | grep -viE '^(Co-Authored-By|Claude-Session)' | sed '/^$/d' | head -8 > notes.md; fi
          cat notes.md
          # (retour à la ligne final indispensable avant le délimiteur)
          { echo 'RELEASE_NOTES<<LUMIO_NOTES_EOF'; cat notes.md; echo; echo 'LUMIO_NOTES_EOF'; } >> "$GITHUB_ENV"
      - name: Source AltStore / FlareStore (mises à jour automatiques)
        run: node scripts/make-source.mjs "1.0.${{ github.run_number }}" "build-${{ github.run_number }}" lumio-unsigned.ipa
      - name: Texte de la Release
        run: |
          {
            echo "## Lumio 1.0.${{ github.run_number }}"
            echo
            cat notes.md
            echo
            echo "---"
            echo "iPhone : mets à jour depuis FlareStore (source : https://github.com/${{ github.repository }}/releases/latest/download/altstore.json), ou installe lumio-unsigned.ipa avec Sideloadly / SideStore."
            echo "Android (téléphone) : https://github.com/${{ github.repository }}/releases/latest/download/lumio-android.apk"
            echo "Mac (Intel et Apple Silicon) : https://github.com/${{ github.repository }}/releases/latest/download/lumio-mac.dmg"
            echo "Android TV : Lumio TV (https://github.com/nono7444/lumio-tv/releases/latest), ou lumio.wawanono.lol/tv dans Downloader"
            echo "Toutes les notes : https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md"
          } > body.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Lumio 1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: body.md
          fail_on_unmatched_files: false
          files: |
            lumio-unsigned.ipa
            lumio-android.apk
            lumio-mac.dmg
            altstore.json
      - name: Range les notes sous le numéro de version dans CHANGELOG.md
        if: github.ref == 'refs/heads/main'
        run: |
          node scripts/changelog.mjs stamp "1.0.${{ github.run_number }}"
          if git diff --quiet CHANGELOG.md; then exit 0; fi
          git config user.name "lumio-bot"
          git config user.email "lumio-bot@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Notes de version 1.0.${{ github.run_number }} [skip ci]"
          git pull --rebase -q origin main && git push -q origin HEAD:main
